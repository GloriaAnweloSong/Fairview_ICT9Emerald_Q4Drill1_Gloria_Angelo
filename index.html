<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Q4 Drill 1</title>

    <style>
        
        body{
            background-color:#a2d4ec;
        }

    </style>
</head>
<body>
        
<br>

<section class="bg-info">
    <div class="text-center">

        <br><br>
        <h2 class="fw-bold">Electricity Classifier</h2>
        <h7>In this website, you will find out what group of people you will fall under by entering your electricity usage</h7>
        <br><br>

    </div>
</section>
<br><br>

    <div class="container text-center fw-bold card">
        <div class="card-body">
        <br>

                <h4>How much electricity do you actually use?</h4>
                <br>

            <div class="row">
                <form class="d-flex">
                    <label for="KWH">Enter your Kilowatts per hour here! -></label>
                    <input class="form-control" type="text" placeholder="" id="KWH">
                    <button class="btn btn-success" type="button" onclick="checkconsumption()">Consumption Level</button>
                    <br>
                </form>
            </div>
        </div>
        <br>
    </div>

    <script>
        function checkconsumption(){

        
        var KWH = document.getElementById('KWH').value;

        if (isNaN===KWH || KWH==='' || KWH < 0){
            window.alert("Please enter a valid number");
        }

        else if (KWH <= 100){
            window.alert("Lineline Consumer: Discounted electricity rates");

        }

        else if (KWH <= 200){
            window.alert("Low Consumption: Normal residential rate");


        }

        else if (KWH <= 300){
            window.alert("Average Consumption: Typical Electricity Usage");


        }

        else if (KWH <= 500){
            window.alert("High Consumption: Higher Electricity Usage");


        }

        else{
            window.alert("Very High Consumption: Heavy Electricity Usage");

        }
        
    }
    </script>

</body>
</html>
